name = "lift-log"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# The built app is served by the same Worker, so the app and /api share one origin.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "lift-log"
# Replace after `npx wrangler d1 create lift-log` (local dev works with any value).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "worker/migrations"

# Secret, not stored here: `npx wrangler secret put API_TOKEN`
# For local dev put API_TOKEN=... in .dev.vars (git-ignored).
